# Adds one line to docs/daily-log.md every morning and commits it, to keep the GitHub contribution streak.
# Runs on GitHub's servers, so your computer does not need to be on.
name: Daily commit

on:
  schedule:
    # GitHub runs scheduled jobs "best effort": they can be late or skipped when GitHub is busy.
    # Off-peak minutes plus a backup run make a missed day very unlikely (the job skips if today is already logged).
    - cron: "17 2 * * *"    # 02:17 UTC = 07:47 IST (morning run)
    - cron: "43 10 * * *"   # 10:43 UTC = 16:13 IST (backup, only commits if the morning run was missed)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add today's line to the daily log
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          FILE=docs/daily-log.md
          [ -f "$FILE" ] || printf "# Daily log\n\nOne line per day, added automatically by .github/workflows/daily-commit.yml.\n\n" > "$FILE"
          if grep -q "^- $TODAY" "$FILE"; then
            echo "Already logged $TODAY"; exit 0
          fi
          echo "- $TODAY: daily check-in" >> "$FILE"

      - name: Commit and push
        run: |
          # This email belongs to your GitHub account, so the commit counts toward your contribution graph.
          git config user.name "Mamlesh18"
          git config user.email "113204216+Mamlesh18@users.noreply.github.com"
          git add docs/daily-log.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          # [skip render] stops Render from redeploying for this commit.
          git commit -m "Daily log $(TZ=Asia/Kolkata date +%Y-%m-%d) [skip render]"
          git push
