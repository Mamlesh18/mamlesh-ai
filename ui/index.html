<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mamlesh AI OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body>
  <!-- Full-screen agent map -->
  <section id="graph-wrap">
    <div class="brand-tag">Mamlesh//OS</div>
    <div class="graph-tools">
      <button type="button" id="fit">Fit</button>
      <button type="button" id="collapse">Hide tools</button>
    </div>
    <div class="legend">
      <span class="q">queued</span><span class="run">running</span><span class="ok">done</span><span class="err">error</span>
      <span class="hint">click the centre node to chat</span>
    </div>
    <div id="graph"></div>
  </section>

  <!-- Top right: connection status + profile menu -->
  <div id="topright">
    <span id="status" title="Connection"><span id="status-dot" class="dot"></span><span id="status-text">connecting…</span></span>
    <div class="profile">
      <button type="button" id="profile-btn" aria-haspopup="true" aria-expanded="false" title="Profile">M</button>
      <div id="profile-menu" hidden>
        <div id="profile-email" class="muted">…</div>
        <button type="button" id="open-harness">Observability</button>
        <button type="button" id="logout">Log out</button>
      </div>
    </div>
  </div>

  <button type="button" id="chat-fab">Chat →</button>

  <!-- Right drawer: chat (orchestrator) or inspector (any other node) -->
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="tag" id="drawer-title">Chat</span>
      <div class="drawer-actions">
        <button type="button" id="history-btn" class="chat-only">History</button>
        <button type="button" id="new-chat" class="chat-only">+ New</button>
        <button type="button" id="drawer-close" title="Close">✕</button>
      </div>
    </div>

    <section id="chat">
      <div id="chat-list" hidden></div>
      <div id="messages"></div>
      <form id="chat-form">
        <textarea id="query" rows="2" placeholder="Ask anything… (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
        <div class="chat-buttons">
          <button type="button" id="mic" title="Speak">🎤</button>
          <button type="submit" id="send">Send →</button>
        </div>
      </form>
    </section>

    <section id="inspector" hidden>
      <div id="panel-body"></div>
    </section>
  </aside>

  <!-- Observability: full-screen dashboard and per-query trace waterfall -->
  <section id="harness" hidden aria-label="Observability">
    <div class="h-head">
      <div class="h-title"><span class="tag">Observability</span><span id="h-sub" class="muted"></span></div>
      <div class="h-actions">
        <div class="h-range" role="group" aria-label="Time range">
          <button type="button" data-days="1">24 h</button>
          <button type="button" data-days="7" class="on">7 days</button>
        </div>
        <button type="button" id="harness-close" title="Close">✕</button>
      </div>
    </div>
    <div id="harness-body"></div>
  </section>
  <div id="tip" role="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
