<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mamlesh AI OS</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span id="status-dot" class="dot"></span> Mamlesh AI OS</div>
    <form id="query-form">
      <input id="query" placeholder="Ask anything, or press the mic…" autocomplete="off">
      <button type="button" id="mic" title="Speak">🎤</button>
      <button type="submit" id="send">Send</button>
    </form>
    <div id="status" class="muted">connecting…</div>
  </header>

  <main>
    <section id="graph"></section>
    <aside id="panel">
      <p class="muted">Click a node to see what it is doing.</p>
    </aside>
  </main>

  <footer>
    <section>
      <h3>Answer</h3>
      <div id="answer" class="muted">No query yet.</div>
    </section>
    <section>
      <h3>Live events</h3>
      <ol id="log"></ol>
    </section>
  </footer>

  <script src="app.js"></script>
</body>
</html>
